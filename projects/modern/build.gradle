plugins {
    id 'java'
    alias(libs.plugins.unimined)
    alias(libs.plugins.shadow)
}

base {
    archivesName = "${mod_name}-${mod_name_suffix}"
}

def embedOut = layout.buildDirectory.dir('generated/embed')

tasks.register('unpackEmbed', Sync) {
    from { configurations.embed.collect { zipTree(it) } }
    into embedOut
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

sourceSets.main.output.classesDirs.from(embedOut)
classes.dependsOn unpackEmbed

shadowJar {
    exclude { details ->
        details.file.toPath().startsWith(embedOut.get().asFile.toPath())
    }
}

unimined {
    minecraft {
        version minecraft_version
        mappings {
            mojmap()
            parchment(minecraft_version, parchment_version)
            devFallbackNamespace 'mojmap'
        }
        minecraftForge {
            loader loader_version
        }
        combineWith ':core:main'
        defaultRemapJar = false
        remap(tasks.shadowJar)
    }
}

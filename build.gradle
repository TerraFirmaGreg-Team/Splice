plugins {
    alias(libs.plugins.unimined) apply false
    alias(libs.plugins.shadow) apply false
    alias(libs.plugins.spotless) apply false
}

allprojects {
    group = "${mod_package}"
    version = "${mod_version}"
}

subprojects {
    pluginManager.withPlugin('java') {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(findProperty('java_version') as String)
            }
        }

        repositories {
            mavenCentral()
        }

        dependencies {
            compileOnly libs.lombok
            annotationProcessor libs.lombok
        }

        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.release = (findProperty('java_version') as String).toInteger()
            options.compilerArgs << '-Xlint:deprecation'
        }

        apply plugin: 'com.diffplug.spotless'
        spotless {
            encoding 'UTF-8'
            java {
                target 'src/*/java/**/*.java'
                palantirJavaFormat(libs.versions.palantir.java.format.get()).formatJavadoc(true)
                removeUnusedImports()
                trimTrailingWhitespace()
                endWithNewline()
            }
        }
    }

    pluginManager.withPlugin('com.gradleup.shadow') {
        evaluationDependsOn(':core')

        configurations {
            embed
            implementation.extendsFrom(embed)
        }

        dependencies {
            embed libs.jackson.databind
        }

        shadow {
            addShadowJarToAssembleLifecycle = false
        }

        tasks.named('jar').configure {
            enabled = false
        }

        def embedConfig = configurations.embed
        shadowJar {
            from { project(':core').sourceSets.main.output }
            configurations.set([embedConfig])
            enableAutoRelocation = true
            relocationPrefix = "${mod_package}.${mod_id}.shadow"
            mergeServiceFiles()
            destinationDirectory = layout.buildDirectory.dir('tmp')
            archiveClassifier = ''
        }

        tasks.matching { it.name == 'remapShadowJar' }.configureEach {
            destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
            archiveClassifier = ''
        }

        tasks.named('build').configure {
            dependsOn('remapShadowJar')
        }

        tasks.named('processResources').configure {
            def props = [
                    mod_id         : providers.gradleProperty('mod_id').get(),
                    mod_name       : providers.gradleProperty('mod_name').get(),
                    mod_version    : providers.gradleProperty('mod_version').get(),
                    mod_description: providers.gradleProperty('mod_description').get(),
                    mod_authors    : providers.gradleProperty('mod_authors').get(),
                    mod_url        : providers.gradleProperty('mod_url').get(),
                    mod_logo_path  : providers.gradleProperty('mod_logo_path').get(),
            ]
            inputs.properties props
            filesMatching(['META-INF/mods.toml', 'mcmod.info']) {
                expand props
            }
        }
    }
}

pluginManagement {
    repositories {
        gradlePluginPortal() {
            content {
                excludeGroup('org.apache.logging.log4j')
            }
        }
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.wagyourtail.xyz/releases' }
        maven { url = 'https://maven.wagyourtail.xyz/snapshots' }
        // Cleanroom Unimined fork (1.4.36-kappa) — https://github.com/kappa-maintainer/Unimined
        maven { url = 'https://maven.arcseekers.com/releases' }
        maven { url = 'https://jitpack.io' }
        maven {
            url = 'https://repo.spongepowered.org/maven'
            content {
                includeGroup 'org.spongepowered'
                includeGroupByRegex 'org\\.spongepowered.*'
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = "${mod_name}"

['core', 'modern', 'vintage'].each { name ->
    include ":$name"
    project(":$name").projectDir = file("projects/$name")
}
